name: VisualAlarm
options:
  bundleIdPrefix: biz.yamayama
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  VisualAlarm:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: VisualAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.yamayama.VisualAlarm
        PRODUCT_NAME: "$(TARGET_NAME)"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: VisualAlarm
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.utilities
schemes:
  VisualAlarm:
    build:
      targets:
        VisualAlarm: all
    run:
      config: Debug
